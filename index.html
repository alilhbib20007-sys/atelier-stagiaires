<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription des stagiaires</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <nav>
            <span class="logo">Gestion des stagiaires</span>
            <ul>
                <li><a href="/" class="active">Inscription</a></li>
                <li><a href="/liste.html">Liste des stagiaires</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Inscription d'un stagiaire</h1>
        <p class="intro">La photo est envoyée à Cloudinary, puis les informations sont enregistrées dans MySQL (Aiven).</p>

        <form id="formulaire" class="card" enctype="multipart/form-data" novalidate>
            <div class="champ">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" maxlength="100" required>
            </div>

            <div class="champ">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" maxlength="100" required>
            </div>

            <div class="champ">
                <label for="ville">Ville</label>
                <input type="text" id="ville" name="ville" maxlength="100" required>
            </div>

            <div class="champ">
                <label for="photo">Photo (JPG, PNG, WEBP ou GIF, 4 Mo maximum)</label>
                <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp,image/gif" required>
                <img id="apercu" class="apercu" alt="Aperçu de la photo">
            </div>

            <button type="submit" id="bouton">Inscrire</button>
            <div id="message" class="message" role="status"></div>
        </form>
    </main>

    <script>
        const formulaire = document.getElementById('formulaire');
        const bouton = document.getElementById('bouton');
        const message = document.getElementById('message');
        const champPhoto = document.getElementById('photo');
        const apercu = document.getElementById('apercu');
        const TAILLE_MAX = 4 * 1024 * 1024; // limite des fonctions Vercel : 4,5 Mo par requête

        function afficher(texte, type) {
            message.textContent = texte;
            message.className = 'message ' + type;
        }

        champPhoto.addEventListener('change', function () {
            const fichier = champPhoto.files[0];
            if (fichier) {
                apercu.src = URL.createObjectURL(fichier);
                apercu.style.display = 'block';
            } else {
                apercu.style.display = 'none';
            }
        });

        formulaire.addEventListener('submit', async function (evenement) {
            evenement.preventDefault();

            const donnees = new FormData(formulaire);
            const vides = ['nom', 'prenom', 'ville'].filter(c => !String(donnees.get(c) || '').trim());
            const fichier = champPhoto.files[0];

            if (vides.length) {
                afficher('Veuillez remplir tous les champs.', 'erreur');
                return;
            }
            if (!fichier) {
                afficher('Veuillez choisir une photo.', 'erreur');
                return;
            }
            if (fichier.size > TAILLE_MAX) {
                afficher('La photo ne doit pas dépasser 4 Mo.', 'erreur');
                return;
            }

            bouton.disabled = true;
            bouton.textContent = 'Envoi en cours...';
            message.className = 'message';

            try {
                const reponse = await fetch('/api/inscrire.php', { method: 'POST', body: donnees });
                const resultat = await reponse.json().catch(() => ({ succes: false, message: 'Réponse invalide du serveur.' }));

                if (reponse.ok && resultat.succes) {
                    afficher(resultat.message + ' ', 'ok');
                    const lien = document.createElement('a');
                    lien.href = '/liste.html';
                    lien.textContent = 'Voir la liste';
                    message.appendChild(lien);
                    formulaire.reset();
                    apercu.style.display = 'none';
                } else {
                    afficher(resultat.message || 'Une erreur est survenue.', 'erreur');
                }
            } catch (erreur) {
                afficher('Impossible de contacter le serveur.', 'erreur');
            } finally {
                bouton.disabled = false;
                bouton.textContent = 'Inscrire';
            }
        });
    </script>
</body>
</html>
